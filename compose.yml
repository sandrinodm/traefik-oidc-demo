name: traefik-oidc-header-viewer

services:
  demo:
    build:
      context: .
      args:
        OIDC_PLUGIN_VERSION: v0.21.0
    ports:
      - "${APP_PORT:-80}:80"
    environment:
      OIDC_ISSUER: "${OIDC_ISSUER}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET}"
      OIDC_SESSION_SECRET: "${OIDC_SESSION_SECRET}"
      OIDC_CALLBACK_URI: "${OIDC_CALLBACK_URI:-/oauth2/callback}"
      OIDC_COOKIE_SECURE: "${OIDC_COOKIE_SECURE:-true}"
      OIDC_LOG_LEVEL: "${OIDC_LOG_LEVEL:-WARN}"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
