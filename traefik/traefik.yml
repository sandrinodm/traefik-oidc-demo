global:
  checkNewVersion: false
  sendAnonymousUsage: false

entryPoints:
  web:
    address: ":8080"
    forwardedHeaders:
      insecure: false
    http:
      # Added in Traefik 3.7; SchemaStore's Traefik v2/v3 schemas do not include it yet.
      aliasHeadersStrategy: reject

providers:
  file:
    filename: /etc/traefik/dynamic.yml
    watch: false

experimental:
  localPlugins:
    oidc-provider-selector:
      moduleName: github.com/sandrinodm/traefik-oidc-provider-selector
    traefik-oidc-auth:
      moduleName: github.com/sevensolutions/traefik-oidc-auth

api:
  dashboard: false

accessLog: {}

log:
  level: INFO
