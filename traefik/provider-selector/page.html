{{define "page"}}<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>{{.Title}}</title>
    <style>{{.Styles}}</style>
  </head>
  <body class="min-h-screen bg-zinc-100 text-zinc-950 antialiased">
    <main class="mx-auto flex min-h-screen w-full max-w-md items-center px-6 py-12">
      <section class="w-full rounded-lg border border-zinc-200 bg-white p-6 shadow-sm sm:p-8">
        <div class="mb-6 flex size-10 items-center justify-center rounded-md bg-zinc-950 text-white" aria-hidden="true">
          <svg class="size-5" viewBox="0 0 24 24" fill="none">
            <rect x="5" y="10" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/>
            <path d="M8.5 10V7.5a3.5 3.5 0 0 1 7 0V10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </div>

        <h1 class="text-2xl font-semibold tracking-tight">{{.Title}}</h1>
        <p class="mt-2 text-sm leading-6 text-zinc-600">{{.Description}}</p>

        {{if eq .Mode "chooser"}}
        <div class="mt-6 space-y-3">
          {{range .Providers}}
          <form method="post" action="{{.Action}}">
            <input type="hidden" name="return_to" value="{{$.ReturnTo}}">
            <button class="flex h-12 w-full items-center justify-between rounded-md border border-zinc-300 bg-white px-4 text-sm font-medium text-zinc-900 shadow-xs transition-colors hover:bg-zinc-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-zinc-950" type="submit">
              <span>Continue with {{.Name}}</span>
              <svg class="size-4 text-zinc-400" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                <path d="m7.5 5 5 5-5 5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </form>
          {{end}}
        </div>
        {{else if eq .Mode "unavailable"}}
        <div class="mt-6 rounded-md border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800">
          Check the provider configuration and restart the stack.
        </div>
        {{else if eq .Mode "signed-out"}}
        <a class="mt-6 flex h-11 w-full items-center justify-center rounded-md bg-zinc-950 px-4 text-sm font-medium text-white hover:bg-zinc-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-zinc-950" href="/">Sign in again</a>
        {{end}}
      </section>
    </main>
  </body>
</html>{{end}}
