displayName: OIDC Provider Selector
type: middleware
import: github.com/sandrinodm/traefik-oidc-provider-selector
summary: Renders an OIDC provider chooser and safely returns authenticated requests to their original path.
testData:
  cookieName: oidc_provider
  cookieSecure: false
  templateFile: page.html
  providers:
    - id: provider-1
      name: Google
    - id: provider-2
      name: Auth0
  sessionCookiePrefixes:
    - TraefikOidcAuth.Provider1.
    - TraefikOidcAuth.Provider2.
